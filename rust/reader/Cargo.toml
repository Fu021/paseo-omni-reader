[package]
name = "omni-reader"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jpeg-encoder = "=0.7.1"
markdown = "=1.0.0"
ratex-font = "=0.1.16"
ratex-katex-fonts = "=0.1.16"
ratex-layout = "=0.1.16"
ratex-parser = "=0.1.16"
ratex-types = "=0.1.16"
regex = "=1.13.2"
resvg = { version = "=0.47.0", default-features = false }
roxmltree = "=0.21.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ttf-parser = "=0.25.1"
wasm-bindgen = "=0.2.115"

[profile.release]
lto = true
codegen-units = 1
