name: Reader CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reader-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - name: Audit runtime dependencies
        if: matrix.node == 24
        run: npm audit --omit=dev --audit-level=high
      - name: Install LibreOffice
        if: matrix.node == 24
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Render Office previews
        if: matrix.node == 24
        run: npm run test:office
