name: Reader CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reader-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up the Rust WASM build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.115 --locked
      - name: Prepare a Git installation
        if: matrix.node == 24
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("paseo-plugin.json", "utf8"));
          for (const [command, ...args] of manifest.build) {
            execFileSync(command, args, { stdio: "inherit" });
          }
          NODE
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:office
      - run: npm run check:package
        if: matrix.node == 22
      - name: Load the npm package in the minimum supported Paseo version
        if: matrix.node == 24
        run: npm exec --yes --package=@getpaseo/cli@0.17.5 -- npm run check:package -- --paseo
      - name: Audit runtime dependencies
        if: matrix.node == 24
        run: npm audit --omit=dev --audit-level=high
